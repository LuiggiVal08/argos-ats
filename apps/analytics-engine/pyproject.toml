[project]
name = "argos-analytics-engine"
version = "0.1.0"
description = "Argos ATS - analytics & IA engine (FastAPI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "ta>=0.11",
    "ccxt>=4.1",
    "redis>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "scikit-learn>=1.3",
]

# Optional extras — not installed by default.
# Hot path (tick→candle→signal→order) imports none of these.
# They are loaded lazily with try/except ImportError + _AVAILABLE guards.
# To enable: pip install ".[ml]" or docker compose build --build-arg PIP_EXTRAS=ml
[project.optional-dependencies]
ml = [
    "tensorflow>=2.15",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
]
validation = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-x --tb=short"
asyncio_mode = "auto"
